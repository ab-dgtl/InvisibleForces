<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Оплата прошла успешно — Невидимые опоры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .success-page { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 3rem 1.3rem; }
  .success-message { width: 100%; max-width: 640px; text-align: center; }
  .success-mark { display: block; width: 64px; height: 64px; margin: 0 auto 2rem; color: var(--gold-400); }
  .success-message h1 { font-size: clamp(2.4rem, 7vw, 4rem); color: var(--gold-100); }
  .success-message p:not(.eyebrow) { color: var(--text-soft); margin-bottom: 2rem; }
  .success-message .btn { min-height: 44px; max-width: 100%; letter-spacing: 0.1em; }
  .success-message .btn:focus-visible { outline: 2px solid var(--gold-100); outline-offset: 5px; }
</style>
</head>
<body>
<div class="page-glow" aria-hidden="true"></div>
<main class="success-page">
  <section class="success-message" aria-labelledby="success-title">
    <p class="eyebrow">Невидимые опоры</p>
    <svg class="success-mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <circle cx="32" cy="32" r="30" stroke="currentColor" stroke-width="1.5"/>
      <path d="M19 32l9 9 17-18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1 id="success-title">Оплата прошла успешно</h1>
    <p>Спасибо за оплату и ваше доверие!</p>
    <a class="btn btn-gold" href="index.html">Вернуться на главную</a>
  </section>
</main>
</body>
</html>
